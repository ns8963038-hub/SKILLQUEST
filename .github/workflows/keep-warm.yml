name: Keep the API awake (optional)

# On Render's free plan the API sleeps after ~15 minutes idle, and the next
# student waits about a minute for it to wake. During a pilot or the UAT weeks,
# switch this ON: uncomment the two `schedule` lines below and push. It then
# pings the API every 10 minutes from 07:30 to 23:30 IST. Comment them out again
# when the testing weeks end.
#
# Why not 24/7: Render gives 750 free instance-hours a month SHARED by all your
# free services, and when they run out every free service is suspended until the
# next month. Awake 16 h/day the API uses ~480 h, leaving ~270 h for the AI
# service (which the API wakes whenever a student signs in).
# Pinging /health also runs a tiny database query, which stops the free Supabase
# project from pausing. GitHub may run scheduled jobs a few minutes late.

on:
  # schedule:
  #   - cron: '*/10 2-17 * * *' # every 10 min, 02:00–17:59 UTC = 07:30–23:30 IST
  workflow_dispatch: # or ping once by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API
        env:
          API_URL: ${{ secrets.SKILLQUEST_API_URL }}
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 "$API_URL/health"
