name: CI

# Runs on every PR and on pushes to main. Kept intentionally minimal — smoke
# checks (lint, typecheck, test/build), not full coverage (TRD sec 9).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate # the typed client the code imports
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # The content pipeline: every level and lesson program is compiled and RUN, and
  # each generated field (expected outputs, predict answers, recorded traces,
  # array pictures, hidden cases) is checked against what the JVM actually did;
  # then every question is checked against the course order. Needs a JDK.
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # the programs themselves are compiled with --release 11
      - run: node content/verify-levels.mjs
      - run: node content/build-lessons.mjs # no --fill: fails if anything stored is out of date
      - run: node content/check-order.mjs # no question may use a topic the student hasn't been taught
