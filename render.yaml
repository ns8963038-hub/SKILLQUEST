# Render Blueprint — creates SkillQuest's two back-end services in one go.
# Render dashboard → New → Blueprint → pick this repo. Full guide: docs/DEPLOY.md
#
# Both run in SINGAPORE because the Supabase database is in ap-southeast-1:
# every API request makes several database round trips, so the API must sit
# next to the database (that is what brings latency under the 500 ms target).
#
# Free plan: each service sleeps after ~15 minutes without traffic and takes
# ~30–60 s to wake. Values marked `sync: false` are secrets you paste in the
# dashboard — they are never stored in this file.

services:
  # ---- The Web API (Node + Express + Prisma) ----
  - type: web
    name: skillquest-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: EXECUTION_BACKEND # real Java runs on Paiza.IO (see docs/notes/M6 §9)
        value: paiza
      - key: DATABASE_URL # Supabase → Connect → Transaction pooler (6543, ?pgbouncer=true)
        sync: false
      - key: DIRECT_URL # Supabase → Connect → Session pooler (5432)
        sync: false
      - key: SUPABASE_URL # https://<project-ref>.supabase.co
        sync: false
      - key: CORS_ORIGINS # the Vercel site, e.g. https://skillquest.vercel.app
        sync: false
      - key: AI_SERVICE_URL # the AI service's URL, e.g. https://skillquest-ai.onrender.com
        sync: false
      - key: ADMIN_USER_IDS # comma-separated team user ids (UUIDs) for the research console
        sync: false
      - key: INTERNAL_API_KEY # shared secret, copied from the AI service automatically
        fromService:
          type: web
          name: skillquest-ai
          envVarKey: INTERNAL_API_KEY

  # ---- The AI service (Python + FastAPI) ----
  - type: web
    name: skillquest-ai
    runtime: python
    region: singapore
    plan: free
    rootDir: ai-service
    # The second command downloads the embedding model during the BUILD, into
    # the project folder, so a sleeping service doesn't re-download it on wake.
    buildCommand: pip install -r requirements.txt && python -m app.embeddings
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: FASTEMBED_CACHE_PATH
        value: .fastembed_cache
      - key: INTERNAL_API_KEY # a long random secret, generated by Render
        generateValue: true
      - key: DATABASE_URL # same as the API's DATABASE_URL (the roadmap engine reads the skill graph)
        sync: false
